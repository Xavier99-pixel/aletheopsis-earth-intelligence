services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aletheopsis
      POSTGRES_USER: aletheopsis
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://aletheopsis:change-me@postgis:5432/aletheopsis
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:10000"
    depends_on:
      - postgis
      - redis

volumes:
  postgis_data:
