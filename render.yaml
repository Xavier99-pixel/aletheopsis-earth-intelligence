services:
  - type: web
    name: aletheopsis-earth-intelligence-api
    autoDeployTrigger: commit
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CDSE_CLIENT_ID
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Set this to an existing persistent-disk mount for durable research evidence.
      # The default path works on an ephemeral filesystem but does not survive redeploys.
      - key: ANALYSIS_DATA_DIR
        value: ./data/analysis
      # Optional, authenticated hosted evidence synthesis. Keep all of these
      # server-side; INTELLIGENCE_ALLOW_UNAUTHENTICATED must stay unset in Render.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.2
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: INTELLIGENCE_MAX_REQUESTS_PER_MINUTE
        value: "12"

  - type: web
    name: aletheopsis-earth-intelligence
    autoDeployTrigger: commit
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
